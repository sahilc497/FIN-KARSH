version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: sentiment_alpha_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/sentiment_alpha.db
      - ENVIRONMENT=production
      - FINBERT_DEVICE=cpu
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: sentiment_alpha_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

